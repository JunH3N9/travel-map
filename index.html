<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>My Travel Map</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.css" rel="stylesheet" />
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icons/7.2.3/css/flag-icons.min.css">
</head>

<body>
  <div id="page">
    <div id="content-wrapper">
      <!-- Map buttons -->
      <div id="map">        
        <div id="controls">
          <button id="btn-countries" class="active">Countries</button>
          <button id="btn-detail">Provinces + Cities</button>        
          <button id="btn-planned">Planned Locations</button>
        </div>
        <button id="btn-fullscreen">⛶</button>
      </div>
      <!-- Map key-->
      <div id="map-key">
        <div class="key-item">
          <span class="key-swatch key-outline" style="border-color: #ff6b35;"></span>
          <span>Visited country</span>
        </div>
        <div class="key-item">
          <span class="key-swatch" style="background: #3388ff;"></span>
          <span>Visited province</span>
        </div>
        <div class="key-item">
          <span class="key-swatch" style="background: #2ecc71;"></span>
          <span>Visited city</span>
        </div>
        <div class="key-item">
          <span class="key-swatch key-outline" style="border-color: #f5c518;"></span>
          <span>Planned country</span>
        </div>
        <div class="key-item">
          <span class="key-swatch" style="background: #4d22e6;"></span>
          <span>Planned province/city</span>
        </div>
      </div>
      <!-- Stats -->
      <div id="stats">
        <div id="country-list"></div>
        <div id="summary-box"></div>
      </div>
      <div id="planned-list"></div>
    </div>    
  </div>  

  <script src="https://unpkg.com/maplibre-gl@4.7.0/dist/maplibre-gl.js"></script>
  <script src="script.js"></script>
  
</body>
</html>
